name: Terraform Infrastructure Validation

on:
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Validate BigQuery infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false

      - name: Verify Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform providers
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Validate BigQuery JSON schemas
        run: |
          python3 -m json.tool schemas/billing_daily.json > /dev/null
          python3 -m json.tool schemas/app_daily.json > /dev/null
          echo "Both JSON schema files are valid JSON."
