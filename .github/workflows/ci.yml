name: FinOps CI and Data Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Python, PySpark, and reconciliation checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17 for Spark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install all project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-spark.txt \
            -r requirements-bigquery.txt \
            -r requirements-assistant.txt \
            -r requirements-phase7-load.txt \
            -r requirements-phase3.txt \
            -e .

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Verify runtime dependencies
        run: |
          java -version
          python --version
          python -c "import pyspark, fastapi, duckdb, snowflake.connector; from google.cloud import bigquery; print('Runtime dependencies verified')"

      - name: Run all unit and integration tests
        run: |
          python -m pytest tests/ -v -rs \
            --junitxml=reports/pytest-results.xml

      - name: Generate deterministic synthetic source data
        run: python -m finops.generate_data --days 30 --seed 42

      - name: Run complete PySpark pipeline
        run: |
          python -m finops.spark_transform \
            --raw-dir data/raw \
            --out-dir data/spark

      - name: Apply data quality and reconciliation gate
        run: |
          python -m finops.quality_gate \
            --report data/spark/quality_metrics.json \
            --summary data/spark/quality_gate_summary.json

      - name: Upload data quality and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finops-quality-reports
          path: |
            reports/pytest-results.xml
            data/spark/quality_metrics.json
            data/spark/quality_gate_summary.json
          if-no-files-found: warn
          retention-days: 7
