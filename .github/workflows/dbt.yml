
name: dbt Warehouse Models

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-build:
    name: Warehouse modeling and data quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-phase3.txt

      - name: Install Python and dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-phase3.txt \
            -e .

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Generate deterministic sample data
        run: |
          python -m finops.generate_data --days 30 --seed 42

      - name: Ingest source data into DuckDB
        run: |
          python -m finops.ingest \
            --raw-dir data/raw \
            --db data/warehouse/finops.duckdb

      - name: Validate dbt connection
        run: dbt debug --profiles-dir .

      - name: Build and test dbt models
        run: dbt build --profiles-dir . --target dev

      - name: Check direct cost reconciliation
        run: python -m finops.analytics_report

      - name: Check shared cost allocation and optimization
        run: python -m finops.phase4_report

      - name: Upload dbt execution artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finops-dbt-reports
          path: |
            target/run_results.json
            target/manifest.json
            logs/dbt.log
          if-no-files-found: warn
          retention-days: 7
